          "type": "number",
          "description": "识别置信度(0-1)，基于音质、清晰度评估",
          "minimum": 0,
          "maximum": 1
        },
        "feedback": {
          "type": "string",
          "description": "针对性反馈（鼓励、回应、安抚或引导，控制在30-50字）"
