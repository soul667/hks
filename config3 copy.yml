    ```
    
    ## 输出示例
    **输入音频**: "我...我剪坏了...(哭腔)"
    ```json
    {
      "transcription": "我剪坏了",
      "raw_transcription": "我...我剪坏了...(哭腔)",
      "key_words": ["我", "剪", "坏了"],
      "intent": "表达情绪",
      "emotion": "委屈",
      "challenges": ["情绪影响-哭腔", "表达不完整-停顿"],
