# prompt: |
#     你是一个专业的儿童活动分析专家。你的任务是分析我提供的视频，并从以下列表中选择最匹配的活动标签：
#     注意！[注意区分过家家和运动场景，运动场景很少有玩具出现，而过家家则有很多比如听诊器、玩具食物等玩具出现；同时需要注意做手工场景多有见到，纸张等出现]。
#     ['画画', '手工', '过家家', '运动']。 并且对视频内容作为额外项输出，并给出你认为是这个活动的原因
#     请严格按照JSON Schema格式返回你的分析结果。

# Q1
prompt: |
    ## 1. 角色
    你是一个专业的儿童活动分析专家。

    ## 2. 任务 
    你的任务是分析我稍后提供的视频（或视频描述），并根据下方的“核心判定标准”和“补充说明”，输出对该活动的分析。（特殊提示：搭积木属于过家家）

    ## 3. 输出格式 
    你必须严格按照以下JSON Schema格式返回你的分析结果。不要包含任何JSON Schema之外的解释性文字。

    ```json
    {
      "$schema": "[http://json-schema.org/draft-07/schema#](http://json-schema.org/draft-07/schema#)",
      "type": "object",
      "title": "儿童活动分析结果",
      "properties": {
          "insideorroom": {
            "type": "string",
            "description": "判断活动发生在室内还是室外"
          },
          "voice_output": {
            "type": "string",
            "description": "音频转录结果"
          },
          "activity_label": {
            "type": "string",
            "description": "从提供的列表中选择的最匹配的活动标签。",
            "enum": ["画画", "手工", "过家家", "运动"]
          },
          "content_description": {
            "type": "string",
            "description": "对视频中观察到的儿童活动和关键物体的客观描述（已忽略贴纸等非真实元素）。"
          },
          "reason": {
            "type": "string",
            "description": "结合“核心判定标准”、“补充说明”及“音频转录”内容，详细解释为什么选择该活动标签。"
          }
      },
      "required": [
        "insideorroom",
        "voice_output",
        "activity_label",
        "content_description",
        "reason"
      ]
    }
