# ------------Qwen-Omni相关配置文件--------------------
DASHSCOPE_API_KEY: sk-9b155a5f0d8849bdb1957500a34f644e
voice: Ethan  # 可选: Chelsie(女声), Ethan(男声), Aiden(男声)

# 音频播放器配置
sample_rate: 24000
chunk_size_ms: 100

# 音频提取配置
audio_sample_rate: 16000
audio_chunk_size: 3200

# 视频提取配置
video_fps: 5  # 帧率配置 (支持两种格式):
              # - >= 1: 表示每秒提取几帧 (如 1=每秒1帧, 2=每秒2帧, 5=每秒5帧)
              # - < 1: 表示帧率倒数 (如 0.5=每2秒1帧, 0.333=每3秒1帧, 0.2=每5秒1帧)
              # 建议值: 1 (每秒1帧) 或 0.5 (每2秒1帧)
              # 注意: 帧数越多,处理时间越长,成本越高
video_max_width: 640  # 视频帧最大宽度(像素), 自动等比例缩放
video_start_frame: 0  # 从第几帧开始裁剪 (0表示从开头, 30表示跳过前30帧)
                      # ⚠️ 注意：此参数仅影响视频帧，音频保持完整不裁剪
video_end_frame_offset: 600  # 从结尾倒数第几帧结束 (0表示到结尾, 30表示忽略最后30帧)
                           # ⚠️ 注意：此参数仅影响视频帧，音频保持完整不裁剪

# 模型配置
model: qwen3-omni-flash-realtime
url: wss://dashscope.aliyuncs.com/api-ws/v1/realtime
transcription_model: gummy-realtime-v1

# 输入文件配置
